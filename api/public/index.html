<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2C Video — AI Video Generator</title>
<style>
  :root{
    --ink:#111015; --paper:#efe9e0; --paper2:#e4ddd0; --accent:#ff5a2e; --line:rgba(17,16,21,0.14);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif;}
  .wrap{max-width:720px;margin:0 auto;padding:60px 24px;}
  h1{font-size:36px;margin:0 0 8px;letter-spacing:-1px;}
  .sub{font-family:var(--mono);font-size:13px;opacity:.6;margin-bottom:32px;}
  textarea{width:100%;min-height:120px;padding:16px;font-size:16px;font-family:Georgia,serif;
    border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  button{margin-top:14px;font-family:var(--mono);font-size:14px;padding:12px 22px;border:none;
    border-radius:3px;background:var(--accent);color:#100c08;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .status{font-family:var(--mono);font-size:13px;opacity:.7;margin-top:14px;min-height:20px;}
  video{width:100%;margin-top:24px;border-radius:4px;border:1px solid var(--line);display:none;background:#000;}
</style>
</head>
<body>
<div class="wrap">
  <h1>2C Video</h1>
  <div class="sub">TEXT → VIDEO · POWERED BY A FREE HUGGING FACE MODEL</div>

  <textarea id="prompt" maxlength="500" placeholder="e.g. a paper boat drifting down a rain-soaked street at night, neon signs reflected in the water"></textarea>
  <div><button id="genBtn">Generate video</button></div>
  <div class="status" id="status"></div>
  <video id="result" controls loop></video>
</div>

<script>
const promptEl = document.getElementById('prompt');
const genBtn = document.getElementById('genBtn');
const statusEl = document.getElementById('status');
const videoEl = document.getElementById('result');

genBtn.addEventListener('click', async () => {
  const prompt = promptEl.value.trim();
  if (!prompt) {
    statusEl.textContent = 'Write a scene first.';
    return;
  }
  genBtn.disabled = true;
  genBtn.textContent = 'Generating…';
  videoEl.style.display = 'none';
  statusEl.textContent = 'Sending prompt to the free model — this can take 20–90 seconds, longer if the model is "cold".';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (err.cold_start) {
        statusEl.textContent = 'The free model is waking up (cold start). Wait ~30s and click Generate again.';
      } else {
        statusEl.textContent = 'Error: ' + (err.error || res.status);
      }
      genBtn.disabled = false;
      genBtn.textContent = 'Generate video';
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    videoEl.src = url;
    videoEl.style.display = 'block';
    statusEl.textContent = 'Done.';
  } catch (e) {
    statusEl.textContent = 'Network error — try again.';
  }

  genBtn.disabled = false;
  genBtn.textContent = 'Generate video';
});
</script>
</body>
</html>
